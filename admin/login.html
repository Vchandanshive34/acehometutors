    <p class="sub">Sign in to manage registrations</p>
    <form id="login-form" class="field-stack">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" placeholder="you@acehometutors.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" id="login-btn">Sign in</button>
    </form>
    <div class="error-msg" id="err"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script>
  const sb = window.supabase.createClient(window.ACE_SUPABASE_URL, window.ACE_SUPABASE_ANON_KEY);

  // If already signed in, go straight to dashboard
  sb.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'dashboard.html';
  });

  const form = document.getElementById('login-form');
  const err = document.getElementById('err');
  const btn = document.getElementById('login-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      err.textContent = error.message === 'Invalid login credentials'
        ? 'Incorrect email or password.'
        : error.message;
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Sign in';
      return;
    }
    window.location.href = 'dashboard.html';
  });
</script>
</body>
