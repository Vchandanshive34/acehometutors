<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Dashboard — Ace Home Tutors</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #ffffff;
      color: #333;
    }

    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

    header {
      background: linear-gradient(135deg, #0099FF 0%, #0A6FC2 100%);
      color: white;
      padding: 30px 20px;
      border-radius: 12px;
      margin-bottom: 30px;
      box-shadow: 0 4px 12px rgba(0, 153, 255, 0.2);
    }

    header h1 { margin: 0; font-size: 28px; font-weight: 800; }
    header p { margin: 8px 0 0; opacity: 0.9; font-size: 16px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-left: 4px solid #0099FF;
    }

    .stat-card.new { border-left-color: #FF3210; }
    .stat-card.active { border-left-color: #12885A; }

    .stat-number {
      font-size: 32px;
      font-weight: 800;
      color: #0099FF;
      margin: 0;
    }

    .stat-card.new .stat-number { color: #FF3210; }
    .stat-card.active .stat-number { color: #12885A; }

    .stat-label {
      font-size: 14px;
      color: #666;
      margin-top: 8px;
    }

    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      padding: 12px 16px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }

    .search-box:focus {
      outline: none;
      border-color: #0099FF;
      box-shadow: 0 0 0 3px rgba(0, 153, 255, 0.1);
    }

    .filter-btn {
      padding: 12px 20px;
      border: 1.5px solid #ddd;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      border-color: #0099FF;
      color: #0099FF;
    }

    .filter-btn.active {
      background: #0099FF;
      color: white;
      border-color: #0099FF;
    }

    .refresh-btn {
      padding: 12px 20px;
      background: #0099FF;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .refresh-btn:hover { background: #0A6FC2; }

    .table-wrap {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    thead {
      background: #f9f9f9;
      border-bottom: 1px solid #e0e0e0;
    }

    th {
      padding: 16px;
      text-align: left;
      font-weight: 700;
      color: #666;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid #f0f0f0;
    }

    tbody tr:hover { background: #fafafa; }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-new { background: #FFE8E8; color: #FF3210; }
    .status-active { background: #E4F4EC; color: #12885A; }
    .status-contacted { background: #E3F2FD; color: #0099FF; }
    .status-closed { background: #F5F5F5; color: #999; }

    .muted { color: #999; font-size: 13px; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f0f0f0;
      border-top: 3px solid #0099FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      background: #FFE8E8;
      color: #FF3210;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 4px solid #FF3210;
    }

    .success {
      background: #E4F4EC;
      color: #12885A;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 4px solid #12885A;
    }

    .action-btns {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-contact {
      background: #0099FF;
      color: white;
    }

    .btn-contact:hover { background: #0A6FC2; }

    .btn-close {
      background: #f0f0f0;
      color: #666;
    }

    .btn-close:hover { background: #e0e0e0; }

    footer {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      color: #999;
      font-size: 13px;
    }

    @media (max-width: 768px) {
      .controls { flex-direction: column; }
      .search-box { min-width: 100%; }
      th, td { padding: 12px 8px; font-size: 13px; }
      .status-badge { font-size: 11px; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>📊 Ace Home Tutors Admin</h1>
    <p>Manage student inquiries and track registrations</p>
  </header>

  <div id="message"></div>

  <div class="stats" id="stats">
    <div class="stat-card">
      <div class="stat-number">—</div>
      <div class="stat-label">Total Inquiries</div>
    </div>
    <div class="stat-card new">
      <div class="stat-number">—</div>
      <div class="stat-label">New (Uncontacted)</div>
    </div>
    <div class="stat-card active">
      <div class="stat-number">—</div>
      <div class="stat-label">Active/Matched</div>
    </div>
  </div>

  <div class="controls">
    <input type="text" class="search-box" id="search" placeholder="🔍 Search by parent name, student name, phone...">
    <button class="filter-btn" id="filter-all">All</button>
    <button class="filter-btn" id="filter-new">New</button>
    <button class="filter-btn" id="filter-active">Active</button>
    <button class="refresh-btn" id="refresh">↻ Refresh</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Parent Name</th>
          <th>Student Name</th>
          <th>Phone</th>
          <th>Email</th>
          <th>Class</th>
          <th>Subjects</th>
          <th>Locality</th>
          <th>Status</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="inquiries">
        <tr>
          <td colspan="10" class="loading"><div class="spinner"></div> Loading inquiries...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <footer>
    Last updated: <span id="lastUpdate">—</span> | Data synced from Supabase
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ========== CONFIG ==========
  const SUPABASE_URL = 'https://ugpnaobvrzyefokhomvk.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVncG5hb2J2cnp5ZWZva2hvbXZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NTUxMzMsImV4cCI6MjEwMjUzMTEzM30.aTxhqmZffcRM2eezd5pcvjdAR77n-tFEnf35MGOARmc';

  // ========== STATE ==========
  let allInquiries = [];
  let filteredInquiries = [];
  let currentFilter = 'all';
  let sb = null;

  // ========== INIT ==========
  (async function init() {
    try {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      console.log('✓ Supabase connected');
      await loadInquiries();
    } catch (err) {
      showError('Failed to connect to database: ' + err.message);
      console.error(err);
    }
  })();

  // ========== LOAD DATA ==========
  async function loadInquiries() {
    try {
      const { data, error } = await sb
        .from('students')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        showError('Error loading inquiries: ' + error.message);
        console.error(error);
        return;
      }

      allInquiries = data || [];
      console.log(`✓ Loaded ${allInquiries.length} inquiries`);
      updateStats();
      filterInquiries();
      updateTimestamp();
      showSuccess(`✓ Loaded ${allInquiries.length} inquiries`);
    } catch (err) {
      showError('Unexpected error: ' + err.message);
      console.error(err);
    }
  }

  // ========== STATS ==========
  function updateStats() {
    const total = allInquiries.length;
    const newCount = allInquiries.filter(i => i.status === 'new').length;
    const activeCount = allInquiries.filter(i => i.status === 'active').length;

    document.getElementById('stats').innerHTML = `
      <div class="stat-card">
        <div class="stat-number">${total}</div>
        <div class="stat-label">Total Inquiries</div>
      </div>
      <div class="stat-card new">
        <div class="stat-number">${newCount}</div>
        <div class="stat-label">New (Uncontacted)</div>
      </div>
      <div class="stat-card active">
        <div class="stat-number">${activeCount}</div>
        <div class="stat-label">Active/Matched</div>
      </div>
    `;
  }

  // ========== FILTER ==========
  function filterInquiries() {
    let filtered = allInquiries;

    if (currentFilter === 'new') {
      filtered = filtered.filter(i => i.status === 'new');
    } else if (currentFilter === 'active') {
      filtered = filtered.filter(i => i.status === 'active');
    }

    const searchTerm = document.getElementById('search').value.toLowerCase();
    if (searchTerm) {
      filtered = filtered.filter(i =>
        (i.parent_name?.toLowerCase().includes(searchTerm)) ||
        (i.student_name?.toLowerCase().includes(searchTerm)) ||
        (i.phone?.includes(searchTerm)) ||
        (i.email?.toLowerCase().includes(searchTerm))
      );
    }

    filteredInquiries = filtered;
    renderTable();
  }

  // ========== RENDER TABLE ==========
  function renderTable() {
    const tbody = document.getElementById('inquiries');

    if (filteredInquiries.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="10" class="empty-state">
            <div class="empty-state-icon">📭</div>
            <div>No inquiries found</div>
          </td>
        </tr>
      `;
      return;
    }

    tbody.innerHTML = filteredInquiries.map(inq => `
      <tr>
        <td><strong>${escapeHtml(inq.parent_name || '—')}</strong></td>
        <td>${escapeHtml(inq.student_name || '—')}</td>
        <td><a href="tel:${inq.phone}" style="color: #0099FF; text-decoration: none;">${escapeHtml(inq.phone || '—')}</a></td>
        <td class="muted">${escapeHtml(inq.email || '—')}</td>
        <td class="muted">${escapeHtml(inq.student_class || '—')}</td>
        <td class="muted">${escapeHtml(inq.subjects?.substring(0, 40) || '—')}${inq.subjects?.length > 40 ? '…' : ''}</td>
        <td class="muted">${escapeHtml(inq.locality || '—')}</td>
        <td>${getStatusBadge(inq.status)}</td>
        <td class="muted">${formatDate(inq.created_at)}</td>
        <td class="action-btns">
          ${inq.status === 'new' ? `<button class="action-btn btn-contact" onclick="markContacted('${inq.id}')">Contact</button>` : ''}
          ${inq.status !== 'closed' ? `<button class="action-btn btn-close" onclick="markClosed('${inq.id}')">Close</button>` : '<span class="muted">—</span>'}
        </td>
      </tr>
    `).join('');
  }

  // ========== ACTIONS ==========
  async function markContacted(id) {
    try {
      const { error } = await sb.from('students').update({ status: 'active' }).eq('id', id);
      if (error) throw error;
      await loadInquiries();
      showSuccess('✓ Marked as contacted');
    } catch (err) {
      showError('Error updating status: ' + err.message);
    }
  }

  async function markClosed(id) {
    try {
      const { error } = await sb.from('students').update({ status: 'closed' }).eq('id', id);
      if (error) throw error;
      await loadInquiries();
      showSuccess('✓ Marked as closed');
    } catch (err) {
      showError('Error updating status: ' + err.message);
    }
  }

  // ========== UI HELPERS ==========
  function getStatusBadge(status) {
    const badges = {
      'new': '<span class="status-badge status-new">New</span>',
      'active': '<span class="status-badge status-active">Active</span>',
      'contacted': '<span class="status-badge status-contacted">Contacted</span>',
      'closed': '<span class="status-badge status-closed">Closed</span>'
    };
    return badges[status] || `<span class="status-badge">${escapeHtml(status)}</span>`;
  }

  function formatDate(isoDate) {
    if (!isoDate) return '—';
    const date = new Date(isoDate);
    return date.toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric' });
  }

  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function updateTimestamp() {
    document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('en-IN');
  }

  function showError(msg) {
    const el = document.getElementById('message');
    el.innerHTML = `<div class="error">${escapeHtml(msg)}</div>`;
    setTimeout(() => el.innerHTML = '', 5000);
  }

  function showSuccess(msg) {
    const el = document.getElementById('message');
    el.innerHTML = `<div class="success">${escapeHtml(msg)}</div>`;
    setTimeout(() => el.innerHTML = '', 3000);
  }

  // ========== EVENT LISTENERS ==========
  document.getElementById('search').addEventListener('input', filterInquiries);
  document.getElementById('refresh').addEventListener('click', loadInquiries);

  document.getElementById('filter-all').addEventListener('click', function() {
    currentFilter = 'all';
    updateFilterButtons();
    filterInquiries();
  });

  document.getElementById('filter-new').addEventListener('click', function() {
    currentFilter = 'new';
    updateFilterButtons();
    filterInquiries();
  });

  document.getElementById('filter-active').addEventListener('click', function() {
    currentFilter = 'active';
    updateFilterButtons();
    filterInquiries();
  });

  function updateFilterButtons() {
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('filter-' + currentFilter).classList.add('active');
  }

  updateFilterButtons();
</script>

</body>
</html>
