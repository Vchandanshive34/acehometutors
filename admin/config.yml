# Ace Home Tutors — Decap CMS config
#
# IMPORTANT: replace YOUR_WORKER_URL below with the URL of your deployed
# OAuth proxy (see admin/OAUTH_SETUP.md) before this will work.

backend:
  name: github
  repo: vchandanshive34/acehometutors
  branch: main
  base_url: https://ace-tutors-cms-auth.vchandanshive34.workers.dev
  auth_endpoint: auth

publish_mode: simple
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "tutors"
    label: "Tutors"
    files:
      - name: "tutors"
        label: "Tutor List (Homepage)"
        file: "data/tutors.json"
        fields:
          - label: "Tutors"
            name: "tutors"
            widget: "list"
            summary: "{{fields.name}} — {{fields.teaches}}"
            fields:
              - { label: "Full Name", name: "name", widget: "string" }
              - { label: "Location", name: "location", widget: "string", hint: "e.g. Vashi, Navi Mumbai" }
              - { label: "Experience", name: "experience", widget: "string", hint: "e.g. 4 yrs experience" }
              - { label: "Teaches (level shown on card)", name: "teaches", widget: "string", hint: "e.g. Class V-VIII" }
              - label: "Subjects / chips"
                name: "subjects"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Subject / chip text", name: "name", widget: "string" }
                  - { label: "Highlighted (blue chip)", name: "highlighted", widget: "boolean", default: false }

  - name: "testimonials"
    label: "Testimonials"
    files:
      - name: "testimonials"
        label: "Testimonials (Homepage)"
        file: "data/testimonials.json"
        fields:
          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Parent's First Name", name: "name", widget: "string" }
              - { label: "Role / Location", name: "role", widget: "string", hint: "e.g. Parent · Nerul" }
              - { label: "Star Rating (1-5)", name: "rating", widget: "number", min: 1, max: 5, default: 5, value_type: "int" }

  - name: "services"
    label: "Services / Subjects"
    files:
      - name: "services"
        label: "Service Cards (Homepage)"
        file: "data/services.json"
        fields:
          - label: "Services"
            name: "services"
            widget: "list"
            summary: "{{fields.tag}} — {{fields.title}}"
            fields:
              - label: "Icon"
                name: "icon"
                widget: "select"
                options:
                  - { label: "Graduation cap (All Boards)", value: "board" }
                  - { label: "Books (Middle School)", value: "middle" }
                  - { label: "Certificate (Board Exams)", value: "board_exam" }
                  - { label: "Mortarboard (Senior Secondary)", value: "senior" }
                  - { label: "Star / Target (Entrance Prep)", value: "entrance" }
                  - { label: "Laptop (Online)", value: "online" }
              - { label: "Small Tag", name: "tag", widget: "string", hint: "e.g. All Boards" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Sub-chips"
                name: "subs"
                widget: "list"
                field: { label: "Chip text", name: "sub", widget: "string" }
